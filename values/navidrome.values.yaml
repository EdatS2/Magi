workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ND_MUSICFOLDER: /music
            ND_SCANNER_SCHEDULE: "@every 15m"
            ND_LOGLEVEL: info
            ND_SESSIONTIMEOUT: 24h
            ND_ENABLETRANSCODINGCONFIG: false
            ND_EXTAUTH_TRUSTEDSOURCES: 10.42.0.0/16
            ND_EXTAUTH_USERHEADER: Remote-User
            ND_ENABLEUSEREDITING: false
ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/auth-url: "http://ak-outpost-authentik-embedded-outpost.auth.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx"
      nginx.ingress.kubernetes.io/auth-signin: "https://auth.salverdaserver.nl/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
      nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
      nginx.ingress.kubernetes.io/auth-snippet: proxy_set_header X-Forwarded-Host $http_host;
      nginx.ingress.kubernetes.io/configuration-snippet: |
        auth_request_set $authentik_user $upstream_http_x_authentik_username;
        proxy_set_header Remote-User $authentik_user;
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: music.salverdaserver.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: navidrome-tls
        hosts:
          - music.salverdaserver.nl
    integrations:
      nginx:
        enabled: false
persistence:
  data:
    enabled: true
    mountPath: /data
    size: 5Gi
    storageClass: longhorn
  music:
    enabled: true
    mountPath: /music
    size: 100Gi
    storageClass: longhorn
