apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: database
spec:
  bootstrap:
    initdb:
      import:
        type: microservice
        databases:
          - immich
        source: 
          externalCluster: pg1
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

  externalClusters:
    - name: pg1
      connectionParameters:
        host: postgres-postgresql.database
        dbname: immich
        user: postgres
      password:
        name: app-secret
        key: password

  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18
  storage:
    size: 2Gi
  postgresql:
    shared_preload_libraries: # load vchord shared library
    - "vchord"
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich-cluster
  namespace: database
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich-cluster
  podMetricsEndpoints:
  - port: metrics
