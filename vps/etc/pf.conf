# /etc/pf.conf on the VPS (gaspard.openbsd.amsterdam)
# Default deny in. The VPS forwards nothing; haproxy originates all traffic to home.

ext_if	= "vio0"
wg_if	= "wg0"
ingress	= "10.13.13.12"		# ingress-nginx-vps, reached over wg0

table <bruteforce> persist

set skip on lo
set block-policy drop
set loginterface $ext_if

block all
antispoof quick for $ext_if
block in quick from <bruteforce>

# IPv6 breaks without NDP, RA and PMTU discovery, so allow ICMPv6
pass inet6 proto icmp6
pass inet proto icmp icmp-type { echoreq unreach }

# DHCPv4 for "inet autoconf"
pass in on $ext_if inet proto udp from port 67 to port 68

pass in on $ext_if proto tcp to ($ext_if) port ssh \
	keep state (max-src-conn 10, max-src-conn-rate 15/5, overload <bruteforce> flush global)

pass in on $ext_if proto udp to ($ext_if) port 51820

# Web. One label per service address: `pfctl -sl` gives bytes and connections per service.
pass in on $ext_if inet  proto tcp to 46.23.89.225             port { 80 443 } label "ipv4"
pass in on $ext_if inet6 proto tcp to 2a03:6000:6e64:622::100 port { 80 443 } label "headscale"
pass in on $ext_if inet6 proto tcp to 2a03:6000:6e64:622::101 port { 80 443 } label "cloud"
pass in on $ext_if inet6 proto tcp to 2a03:6000:6e64:622::102 port { 80 443 } label "immich"
pass in on $ext_if inet6 proto tcp to 2a03:6000:6e64:622::103 port { 80 443 } label "music"

# Uncomment if headscale's embedded DERP server is enabled
# pass in on $ext_if proto udp to 2a03:6000:6e64:622::100 port 3478 label "headscale-stun"

pass out on $ext_if
# Over the tunnel: only haproxy to the ingress
pass out on $wg_if proto tcp to $ingress port 443
