# /etc/haproxy/haproxy.cfg on the VPS (gaspard.openbsd.amsterdam)
#
# TLS passthrough edge for salverdaserver.nl. No certificates live here.
# IPv4 and IPv6 both terminate in haproxy; routing is by SNI via sni.map.
# Home is reached over wg0 (IPv4 only) with PROXY v2, so the ingress sees
# the real client address and the address the client dialed.

global
	log		/dev/log local0 info
	maxconn		4096
	user		_haproxy
	group		_haproxy
	daemon

defaults
	log		global
	mode		tcp
	option		dontlognull
	retries		2
	timeout connect	5s
	timeout client	60s
	timeout server	60s
	timeout tunnel	1h
	timeout client-fin 30s

frontend tls_in
	bind	46.23.89.225:443
	bind	[2a03:6000:6e64:622::100]:443
	bind	[2a03:6000:6e64:622::101]:443
	bind	[2a03:6000:6e64:622::102]:443
	bind	[2a03:6000:6e64:622::103]:443

	# client ip:port -> dialed ip:port, SNI, backend, connect/total time, bytes, termination state
	log-format "%ci:%cp -> %fi:%fp sni=%[capture.req.hdr(0)] be=%b %Tc/%Tt %B %ts"

	tcp-request inspect-delay 5s
	tcp-request content capture req.ssl_sni len 64
	tcp-request content reject unless { req.ssl_hello_type 1 }
	tcp-request content reject unless { req.ssl_sni,lower,map(/etc/haproxy/sni.map) -m found }

	use_backend %[req.ssl_sni,lower,map(/etc/haproxy/sni.map)]

backend be_headscale
	server headscale [2a03:6000:6e64:622::100]:8443

backend be_home
	# ingress-nginx-vps; it requires PROXY v2, so health checks send it too
	server ingress 10.13.13.12:443 send-proxy-v2 check check-send-proxy inter 10s

# Plain HTTP only redirects. ACME uses TLS-ALPN-01 (headscale) or DNS-01 (cert-manager).
frontend http_in
	mode	http
	bind	46.23.89.225:80
	bind	[2a03:6000:6e64:622::100]:80
	bind	[2a03:6000:6e64:622::101]:80
	bind	[2a03:6000:6e64:622::102]:80
	bind	[2a03:6000:6e64:622::103]:80
	option	httplog
	http-request redirect scheme https code 301
